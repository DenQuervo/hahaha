
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Lily for You</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse, #171331, #03030b 75%);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.scene {
  position: relative;
  width: min(90vw, 430px);
  height: 480px;
}

svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.petal {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: bloom 2s ease-out both, glow 3s ease-in-out infinite alternate;
}

@keyframes bloom {
  from { opacity: 0; transform: scale(0.05); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes glow {
  from { filter: drop-shadow(0 0 4px #ff70dc); }
  to { filter: drop-shadow(0 0 14px #81eaff); }
}

.spark {
  fill: #fff;
  filter: drop-shadow(0 0 6px #ff75e7);
  animation: twinkle 1.5s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: 1; }
}

h1 {
  color: #ff8cde;
  text-align: center;
  font-size: clamp(25px, 6vw, 38px);
  font-style: italic;
  text-shadow: 0 0 12px #ff35d0;
  margin: 0;
}

p {
  color: #8ce8ff;
  text-align: center;
  text-shadow: 0 0 10px #49cfff;
  font-style: italic;
}
</style>
</head>
<body>

<div class="scene">
<svg viewBox="0 0 400 480" aria-label="Glowing pink and blue lily">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0ff"/>
      <stop offset=".45" stop-color="#ff69d2"/>
      <stop offset="1" stop-color="#a42bdb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e7ffff"/>
      <stop offset=".5" stop-color="#78e7ff"/>
      <stop offset="1" stop-color="#5573e8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a6ffb9"/>
      <stop offset="1" stop-color="#08783d"/>
    </linearGradient>
  </defs>

  <!-- Green stem and leaves -->
  <path d="M200 220 Q205 310 195 430"
        stroke="#42ff8a" stroke-width="8" fill="none"
        stroke-linecap="round"/>
  <path d="M199 355 Q120 270 75 320 Q125 385 199 355Z"
        fill="url(#leaf)" stroke="#9dffb3" stroke-width="2"/>
  <path d="M198 390 Q260 300 320 330 Q285 400 198 390Z"
        fill="url(#leaf)" stroke="#9dffb3" stroke-width="2"/>
  <path d="M190 355 L100 323 M205 390 L300 337"
        stroke="#c2ffd0" stroke-width="2" fill="none"/>

  <!-- Six lily petals -->
  <g class="petal">
    <path d="M200 230 Q95 155 155 60 Q200 105 200 230Z"
          fill="url(#pink)" stroke="#ffc8f4" stroke-width="2"/>
  </g>
  <g class="petal" style="animation-delay:.15s">
    <path d="M200 230 Q95 155 155 60 Q200 105 200 230Z"
          transform="rotate(60 200 230)"
          fill="url(#blue)" stroke="#b8f6ff" stroke-width="2"/>
  </g>
  <g class="petal" style="animation-delay:.3s">
    <path d="M200 230 Q95 155 155 60 Q200 105 200 230Z"
          transform="rotate(120 200 230)"
          fill="url(#pink)" stroke="#ffc8f4" stroke-width="2"/>
  </g>
  <g class="petal" style="animation-delay:.45s">
    <path d="M200 230 Q95 155 155 60 Q200 105 200 230Z"
          transform="rotate(180 200 230)"
          fill="url(#blue)" stroke="#b8f6ff" stroke-width="2"/>
  </g>
  <g class="petal" style="animation-delay:.6s">
    <path d="M200 230 Q95 155 155 60 Q200 105 200 230Z"
          transform="rotate(240 200 230)"
          fill="url(#pink)" stroke="#ffc8f4" stroke-width="2"/>
  </g>
  <g class="petal" style="animation-delay:.75s">
    <path d="M200 230 Q95 155 155 60 Q200 105 200 230Z"
          transform="rotate(300 200 230)"
          fill="url(#blue)" stroke="#b8f6ff" stroke-width="2"/>
  </g>

  <!-- Lily center and stamens -->
  <circle cx="200" cy="230" r="17" fill="#fff3a6"/>
  <g stroke="#fff1a0" stroke-width="4" stroke-linecap="round">
    <path d="M200 230 L170 185 M200 230 L187 170
             M200 230 L210 168 M200 230 L230 185"/>
  </g>
  <g fill="#ffdf77">
    <circle cx="170" cy="185" r="6"/>
    <circle cx="187" cy="170" r="6"/>
    <circle cx="210" cy="168" r="6"/>
    <circle cx="230" cy="185" r="6"/>
  </g>

  <!-- Sparkles -->
  <g class="spark">
    <circle cx="60" cy="100" r="3"/>
    <circle cx="325" cy="120" r="4"/>
    <circle cx="85" cy="230" r="3"/>
    <circle cx="310" cy="270" r="3"/>
    <circle cx="115" cy="55" r="3"/>
    <circle cx="280" cy="65" r="4"/>
    <circle cx="130" cy="400" r="3"/>
    <circle cx="290" cy="420" r="3"/>
  </g>
</svg>
</div>

<h1>I'M SORRY 💗</h1>
<p>BFF NA ULIT US <3</p>

</body>
</html>
