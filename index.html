
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tulips for you</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle, #171333, #08091d 70%);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Heading and message */
h1 {
    color: #ff9be9;
    text-shadow: 0 0 10px #ff4dd2, 0 0 25px #ff4dd2;
    font-size: clamp(24px, 6vw, 35px);
    text-align: center;
    margin: 5px 10px;
    opacity: 0;
    animation: textEntrance 1s ease-out 1.8s forwards;
}

p {
    color: #8eeaff;
    text-shadow: 0 0 12px #00bfff;
    font-size: 18px;
    text-align: center;
    margin-top: 8px;
    opacity: 0;
    animation: textEntrance 1s ease-out 2.2s forwards;
}

/* Three tulips entrance */
.garden {
    width: min(90vw, 430px);
    height: auto;
    overflow: visible;
    transform-origin: bottom center;
    opacity: 0;
    animation:
        flowerEntrance 2s ease-out forwards,
        flowerFloat 3s ease-in-out 2s infinite;
}

@keyframes flowerEntrance {
    0% {
        opacity: 0;
        transform: translateY(150px) scale(0.3);
        filter: drop-shadow(0 0 0px #ff71e8);
    }

    60% {
        opacity: 1;
        transform: translateY(-15px) scale(1.05);
        filter: drop-shadow(0 0 18px #ff71e8);
    }

    80% {
        transform: translateY(5px) scale(0.98);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 8px #ff71e8);
    }
}

@keyframes flowerFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

/* Text entrance */
@keyframes textEntrance {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Tulip colors */
.pink {
    fill: url(#pinkGradient);
    stroke: #ffd5f5;
    stroke-width: 1.5;
}

.blue {
    fill: url(#blueGradient);
    stroke: #c8f7ff;
    stroke-width: 1.5;
}

.leaf {
    fill: #24c95a;
    stroke: #8aff9d;
    stroke-width: 1.5;
}

.stem {
    fill: none;
    stroke: #36df68;
    stroke-width: 7;
    stroke-linecap: round;
}

/* Sparkle effects */
.sparkle {
    position: absolute;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 0 10px #ff7be8, 0 0 20px #65eaff;
    animation: sparkle 2s ease-in-out infinite alternate;
}

@keyframes sparkle {
    from {
        opacity: 0.2;
        transform: scale(0.7) rotate(0deg);
    }

    to {
        opacity: 1;
        transform: scale(1.3) rotate(25deg);
    }
}

.s1 { top: 12%; left: 15%; }
.s2 { top: 22%; right: 15%; animation-delay: 0.5s; }
.s3 { top: 48%; left: 8%; animation-delay: 1s; }
.s4 { top: 60%; right: 10%; animation-delay: 0.7s; }
.s5 { top: 35%; left: 25%; animation-delay: 1.2s; }
.s6 { top: 40%; right: 25%; animation-delay: 0.3s; }

@media (max-height: 650px) {
    .garden {
        width: min(65vw, 300px);
    }

    h1 {
        font-size: 27px;
    }

    p {
        font-size: 15px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .garden, h1, p, .sparkle {
        animation: none;
        opacity: 1;
        transform: none;
    }
}
</style>
</head>

<body>

<!-- Glowing sparkles -->
<span class="sparkle s1">✦</span>
<span class="sparkle s2">✧</span>
<span class="sparkle s3">✧</span>
<span class="sparkle s4">✦</span>
<span class="sparkle s5">✧</span>
<span class="sparkle s6">✦</span>

<!-- Three tulips -->
<svg class="garden" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="pinkGradient"
                        x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd0f3"/>
            <stop offset="50%" stop-color="#ff63ce"/>
            <stop offset="100%" stop-color="#d92eaa"/>
        </linearGradient>

        <linearGradient id="blueGradient"
                        x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d6fbff"/>
            <stop offset="50%" stop-color="#60e4ff"/>
            <stop offset="100%" stop-color="#319bff"/>
        </linearGradient>
    </defs>

    <!-- Green stems -->
    <path class="stem" d="M200 440 Q180 300 105 180"/>
    <path class="stem" d="M200 440 Q200 270 200 130"/>
    <path class="stem" d="M200 440 Q230 290 295 190"/>

    <!-- Green leaves -->
    <path class="leaf"
          d="M195 370 Q115 350 65 270
             Q140 285 195 370 Z"/>

    <path class="leaf"
          d="M202 390 Q270 350 330 290
             Q300 365 202 390 Z"/>

    <path class="leaf"
          d="M185 330 Q150 265 170 210
             Q205 265 185 330 Z"/>

    <path class="leaf"
          d="M215 350 Q250 270 250 225
             Q275 300 215 350 Z"/>

    <!-- Left blue tulip -->
    <g transform="translate(105 175)">
        <path class="blue"
              d="M-48 10
                 Q-62 -30 -35 -57
                 Q-25 -25 -12 -47
                 Q0 -75 12 -45
                 Q35 -65 45 -35
                 Q65 -5 42 22
                 Q10 50 -8 42
                 Q-35 40 -48 10 Z"/>

        <path d="M-30 -42 Q-18 0 -8 35"
              fill="none" stroke="#e5fcff" stroke-width="2"/>

        <path d="M8 -40 Q12 0 5 38"
              fill="none" stroke="#e5fcff" stroke-width="2"/>

        <path d="M32 -30 Q30 5 10 35"
              fill="none" stroke="#e5fcff" stroke-width="2"/>
    </g>

    <!-- Center pink tulip -->
    <g transform="translate(200 120)">
        <path class="pink"
              d="M-48 25
                 Q-62 -18 -38 -58
                 Q-23 -34 -12 -63
                 Q0 -85 12 -60
                 Q28 -36 38 -58
                 Q60 -15 47 25
                 Q30 65 0 68
                 Q-30 65 -48 25 Z"/>

        <path d="M-30 -43 Q-22 5 -5 60"
              fill="none" stroke="#ffe7fa" stroke-width="2"/>

        <path d="M0 -58 Q5 0 0 65"
              fill="none" stroke="#ffe7fa" stroke-width="2"/>

        <path d="M30 -42 Q25 10 8 58"
              fill="none" stroke="#ffe7fa" stroke-width="2"/>
    </g>

    <!-- Right blue tulip -->
    <g transform="translate(295 185)">
        <path class="blue"
              d="M-45 15
                 Q-60 -20 -35 -55
                 Q-20 -28 -10 -50
                 Q5 -73 18 -45
                 Q38 -62 48 -30
                 Q60 5 38 28
                 Q10 48 -10 42
                 Q-30 38 -45 15 Z"/>

        <path d="M-28 -40 Q-20 0 -5 35"
              fill="none" stroke="#e5fcff" stroke-width="2"/>

        <path d="M10 -42 Q15 0 5 38"
              fill="none" stroke="#e5fcff" stroke-width="2"/>

        <path d="M32 -27 Q30 5 10 35"
              fill="none" stroke="#e5fcff" stroke-width="2"/>
    </g>

    <!-- Pink ribbon bow -->
    <path d="M200 425
             C165 390 150 420 190 435
             C150 465 180 470 200 440
             C220 470 250 465 210 435
             C250 420 235 390 200 425 Z"
          fill="#ff8bdd" stroke="#ffd6f5" stroke-width="2"/>

    <circle cx="200" cy="435" r="8" fill="#ffd6f5"/>

</svg>

<!-- Message -->
<h1>FLOWERS FOR U!</h1>
<p>TARA SOGO HEHEHEH</p>

</body>
</html>
